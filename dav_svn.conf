LoadModule dav_svn_module /usr/lib/apache2/mod_dav_svn.so
LoadModule authz_svn_module /usr/lib/apache2/mod_authz_svn.so

<Location /svn>
     DAV svn
     SVNParentPath /home/svn
     LimitRequestBody 0
     SVNListParentPath On
     AuthType Basic
     AuthName "Subversion Repository"
     AuthUserFile /etc/subversion/passwd
     AuthzSVNAccessFile /etc/subversion/subversion-access-control
     Require valid-user
  </Location>


# Raw WebDAV requests under /svn are too noisy for the access log;
# the svn-op log below records them as one line per operation instead.
SetEnvIf Request_URI "^/svn/" svn_dav

# Log high-level SVN operations (checkout, commit, update, ...), one line each
LogFormat "svn-op %{%Y-%m-%d %H:%M:%S}t %a %u %{SVN-REPOS-NAME}e %{SVN-ACTION}e" svn_ops
CustomLog /dev/stdout svn_ops env=SVN-ACTION
