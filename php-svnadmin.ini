; Session cookie hardening for iF.SVNAdmin, which has no CSRF tokens and
; does not escape output (CVE-2019-15128 and reflected XSS).
; SameSite=Strict keeps the browser from sending the login cookie on
; requests started from other sites, so a link or form elsewhere cannot
; act as a logged-in administrator.
session.cookie_samesite = Strict
session.cookie_httponly = 1
session.use_strict_mode = 1
