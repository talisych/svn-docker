# Alpine's httpd.conf sets "AllowOverride None", so the .htaccess files
# shipped with iF.SVNAdmin are ignored. Enforce the same rules here.
# Apache matches <Directory> against the requested path, not the symlink
# target, so cover both the real path and the htdocs symlink.
<Directory "/opt/svnadmin/data">
    Require all denied
</Directory>
<Directory "/var/www/localhost/htdocs/svnadmin/data">
    Require all denied
</Directory>

<Files "cli.php">
    Require all denied
</Files>

# Hide Apache/OS/PHP version details
ServerTokens Prod
ServerSignature Off
